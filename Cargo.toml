[workspace]
members = [
    "crates/fjord-app",
    "crates/fjord-api",
    "crates/fjord-player",
    "crates/fjord-seerr",
]
resolver = "2"


[workspace.package]
# Bumped together with a `git tag vX.Y.Z` and a CHANGELOG.md entry, as one
# ritual, whenever a version is actually cut — not per-commit. See
# CHANGELOG.md for what each version covers. Distinct from FJORD_BUILD_ID
# (build.rs) which identifies the exact commit a binary was built from and
# changes on every commit — that one exists for HTPC log triage, this one
# is for humans.
version = "0.4.2"
edition = "2021"
authors = ["KalasKonrad"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP + serialization for Jellyfin API
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"
thiserror = "2"

# GUI
slint = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Date/time
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Shared between crates
url = { version = "2", features = ["serde"] }
percent-encoding = "2"

# Secret-at-rest encryption (config.rs token/Seerr fields) — pure-Rust, no
# system crypto library dependency, keeps `cargo build --locked` simple on the HTPC
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
base64 = "0.22"
