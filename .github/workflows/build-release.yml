name: Build nightly release

# Real, from-scratch CI, added 2026-08-17 per direct request — "cant we
# expose it so i can install it via the pkgbuild instead of needing to
# build it from git on the system i want to test on." Runs in a real
# archlinux:latest container (not a generic Ubuntu runner) specifically to
# match the exact distro/glibc/library ABI that fjord-bin's own PKGBUILD
# below installs onto — the whole point of doing this in a container
# instead of on the bare ubuntu-latest host is to avoid a cross-distro
# glibc/library-version mismatch between what CI builds and what a real
# Arch machine actually has installed.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write   # needed to create/update the "nightly" release

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install build + runtime dependencies
        run: |
          pacman -Syu --noconfirm
          # Matches PKGBUILD's own depends()+makedepends() — mpv is needed
          # at BUILD time too (libmpv2-sys links against it via pkg-config,
          # see fjord-player/Cargo.toml's own "mpv must be installed on the
          # system" comment), not just runtime, unlike the existing -git
          # PKGBUILD's makedepends list, which never needed to say so
          # explicitly since every machine that's ever run `makepkg -si`
          # for this package already had mpv installed as a desktop app.
          pacman -S --noconfirm base-devel git rust mpv fontconfig freetype2 libxkbcommon

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history — pkgver()-style r<count>.<hash> needs `git rev-list --count`

      # Added 2026-08-17, found from the very first real run's own published
      # release: it came out named "Nightly build (r.)" — an empty version
      # string, not a crash. Root cause: actions/checkout's own git-ownership
      # workaround runs on the RUNNER host; every `run:` step in a job with
      # `container:` set executes inside a separate `docker exec` with its
      # own $HOME/global git config, so the raw `git rev-list`/`git rev-parse`
      # calls in "Compute version string" hit git's dubious-ownership check
      # (CVE-2022-24765 mitigation) and failed — silently, since `$(...)`
      # command substitution failing doesn't fail the enclosing `echo`, so
      # the step exited 0 with `version=r.` (the literal `r`/`.` survived,
      # both substitutions came back empty). Confirmed directly from the
      # run's own step log (`fatal: detected dubious ownership in repository
      # at '/__w/Fjord/Fjord'`), not guessed.
      - name: Work around git "dubious ownership" check inside the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Added 2026-08-17, live-observed: the first (uncached) run took well
      # past both the dev machine's ~4min and the HTPC's ~15min incremental
      # rebuild times — expected, since neither of those numbers includes
      # compiling the ~715-crate dependency tree (Slint's 3 render backends
      # included) from scratch, which a fresh container pays on every single
      # push with no caching at all. Keyed on Cargo.lock's own hash (not the
      # commit) so the cache only invalidates when dependencies actually
      # change, not on every ordinary app-code push — the overwhelming
      # majority of pushes to this project touch fjord-app/fjord-api/
      # fjord-player source, not Cargo.lock, so most pushes should hit a
      # full cache and only recompile Fjord's own ~4 crates, closer to the
      # dev machine's own incremental time than the cold-build one.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-release-

      - name: Compute version string
        id: ver
        run: |
          echo "version=r$(git rev-list --count HEAD).$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build (release, locked)
        run: cargo build --release --locked

      - name: Package artifact
        run: |
          set -e
          strip --strip-debug target/release/fjord-app
          mkdir -p dist/fjord-bin
          cp target/release/fjord-app dist/fjord-bin/fjord
          cp LICENSE dist/fjord-bin/LICENSE
          cp -r assets dist/fjord-bin/assets
          echo "${{ steps.ver.outputs.version }}" > dist/fjord-bin/VERSION
          tar -C dist -czf fjord-x86_64.tar.gz fjord-bin

      - name: Publish "nightly" release (moving tag, overwritten every push)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "Nightly build (${{ steps.ver.outputs.version }})"
          body: "Automated build of `main` at `${{ steps.ver.outputs.version }}`. Install with `fjord-bin/PKGBUILD` at the repo root — no compile step needed."
          prerelease: true
          make_latest: false
          files: fjord-x86_64.tar.gz
