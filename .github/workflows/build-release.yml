name: Build nightly release

# Real, from-scratch CI, added 2026-08-17 per direct request — "cant we
# expose it so i can install it via the pkgbuild instead of needing to
# build it from git on the system i want to test on."
#
# Switched from GitHub-hosted (ubuntu-latest + an archlinux:latest
# container) to a self-hosted runner on the actual dev machine, same day,
# after a real 17-minute cold-build wait prompted "is that a long time to
# wait until i can test changes?" — GitHub's own cloud runners add a full
# network round trip (push → queued → cold container → download the
# result) on top of the build itself, and no amount of caching removes
# that trip; a runner on hardware that already has the toolchain warm
# does not need to pay it at all. The dev machine already IS Arch Linux,
# so the container's whole reason for existing (matching fjord-bin's own
# runtime ABI) is free here — no container, no per-run `pacman -Syu`
# (which would be genuinely risky to run unattended against a real,
# actively-used desktop's system packages, unlike a disposable cloud
# container), no `actions/cache` (the real `~/.cargo` and `target/` dirs
# already persist naturally between runs on real, persistent disk — a
# cache save/restore round trip would only add latency here, not save
# any), and no git "dubious ownership" workaround (that was specifically
# a container-vs-host UID mismatch; everything here runs as the one real
# user the whole way through). Registered via
# `POST /repos/{owner}/{repo}/actions/runners/registration-token` +
# `config.sh --unattended`, running as a `systemctl --user` service
# (not `svc.sh`'s own system-wide service, which hard-requires sudo) —
# survives as long as the dev machine has an active login session; full
# reboot-survival needs `loginctl enable-linger` run once, by hand, since
# that itself needs root.
on:
  push:
    branches: [main]
    # Path filter added 2026-08-28, direct request — "culd we fix so we
    # dont do a new build on every push only when we do a code change?"
    # Before this, a doc-only push (PLAN.md/CLAUDE.md updates, which this
    # project makes constantly, often several times per code change) still
    # burned a full ~4-5 minute build on the self-hosted runner for
    # nothing to actually compile differently. An inclusion list (paths:),
    # not an exclusion list (paths-ignore:), deliberately — safer against
    # a future new doc/non-code file type silently starting to trigger
    # builds again; anything not explicitly listed here is skipped by
    # default instead. The root PKGBUILD/fjord-bin/PKGBUILD are
    # deliberately NOT included — neither affects what this workflow
    # actually builds (fjord-git compiles from source locally on the
    # target machine, entirely separate from this CI artifact; fjord-bin's
    # own PKGBUILD only controls how the ALREADY-built artifact gets
    # downloaded, not what's in it).
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'assets/**'
      - '.github/workflows/build-release.yml'
  workflow_dispatch: {}

permissions:
  contents: write   # needed to create/update the "nightly" release

jobs:
  build:
    runs-on: [self-hosted, fjord]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history — pkgver()-style r<count>.<hash> needs `git rev-list --count`

      - name: Compute version string
        id: ver
        run: |
          echo "version=r$(git rev-list --count HEAD).$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build (release, locked)
        run: cargo build --release --locked

      - name: Package artifact
        run: |
          set -e
          strip target/release/fjord-app
          mkdir -p dist/fjord-bin
          cp target/release/fjord-app dist/fjord-bin/fjord
          cp LICENSE dist/fjord-bin/LICENSE
          cp -r assets dist/fjord-bin/assets
          echo "${{ steps.ver.outputs.version }}" > dist/fjord-bin/VERSION
          tar -C dist -czf fjord-x86_64.tar.gz fjord-bin

      - name: Publish "nightly" release (moving tag, overwritten every push)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "Nightly build (${{ steps.ver.outputs.version }})"
          body: "Automated build of `main` at `${{ steps.ver.outputs.version }}`. Install with `fjord-bin/PKGBUILD` at the repo root — no compile step needed."
          prerelease: true
          make_latest: false
          files: fjord-x86_64.tar.gz
