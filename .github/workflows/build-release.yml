name: Build release

# Builds Fjord on a self-hosted runner on the dev machine (Arch, like the
# install targets; toolchain, ~/.cargo and target/ stay warm between runs, so
# no container, cache actions or pacman). The runner is a `systemctl --user`
# service: it needs a login session (or `loginctl enable-linger`). Actions are
# pinned to commit SHAs. History: DEVLOG.md → Distribution.
#
# Pushes to `release-X.Y.Z` build the moving "nightly" pre-release
# (fjord-bin-nightly). A `vX.Y.Z` tag on main publishes the release
# "Fjord vX.Y.Z" (fjord-bin) with that version's CHANGELOG.md section.
# Pushes to main build nothing.
on:
  push:
    branches: ['release-*']
    tags: ['v*']
    # Only pushes that change what gets built: an allow-list, so a new kind of
    # doc file never starts a build. PKGBUILDs don't affect the tarball. Not
    # applied to tag pushes.
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'assets/**'
      - '.github/workflows/build-release.yml'
  workflow_dispatch: {}

permissions:
  contents: write   # needed to create/update the "nightly" and tag releases

jobs:
  build:
    runs-on: [self-hosted, fjord]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 — pinned to a commit (self-hosted runner)
        with:
          fetch-depth: 0   # full history — pkgver()-style r<count>.<hash> needs `git rev-list --count`

      - name: Compute version string
        id: ver
        run: |
          echo "version=r$(git rev-list --count HEAD).$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build (release, locked)
        # Rust embeds source paths (panic locations); keep the runner's home
        # folder (and its user name) out of the published binary.
        # TEMPORARY: nightly builds also get --cfg slint_debug_property (Slint
        # then names the property in a "Recursion detected" panic — the
        # Settings crash watch, PLAN.md → Issues); tag builds don't. Remove
        # together with the same line in the root PKGBUILD.
        run: |
          flags="--remap-path-prefix=$HOME=/build"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then flags="$flags --cfg slint_debug_property"; fi
          RUSTFLAGS="$flags" cargo build --release --locked

      - name: Package artifact
        run: |
          set -e
          strip target/release/fjord-app
          mkdir -p dist/fjord-bin
          cp target/release/fjord-app dist/fjord-bin/fjord
          cp LICENSE dist/fjord-bin/LICENSE
          cp -r assets dist/fjord-bin/assets
          echo "${{ steps.ver.outputs.version }}" > dist/fjord-bin/VERSION
          tar -C dist -czf fjord-x86_64.tar.gz fjord-bin

      - name: Publish "nightly" release (moving tag, overwritten every push)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2 — pinned to a commit (self-hosted runner)
        with:
          tag_name: nightly
          name: "Nightly build (${{ steps.ver.outputs.version }})"
          body: "Automated build of `${{ github.ref_name }}` at `${{ steps.ver.outputs.version }}` (development, not a release). Install with `fjord-bin-nightly/PKGBUILD` — no compile step needed."
          prerelease: true
          make_latest: false
          files: fjord-x86_64.tar.gz

      - name: Release notes from CHANGELOG.md
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          set -e
          ver="${GITHUB_REF_NAME#v}"
          awk -v h="## [$ver]" 'index($0, h) == 1 { f = 1; next } /^## \[/ { if (f) exit } f' \
            CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md has no '## [$ver]' section" >&2
            exit 1
          fi

      - name: Publish tag release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2 — pinned to a commit (self-hosted runner)
        with:
          name: "Fjord ${{ github.ref_name }}"
          body_path: release-notes.md
          prerelease: false
          make_latest: true
          files: fjord-x86_64.tar.gz
