[package]
name = "fjord-player"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
# mpv's track-list / chapter-list arrive as JSON (Player's observed properties)
serde.workspace = true
serde_json.workspace = true
# libmpv bindings — mpv must be installed on the system
libmpv2 = "3"
# sys crate for render API functions missing from the safe wrapper
libmpv2-sys = "4"
