[package]
name = "fjord-app"
version.workspace = true
edition = "2021"
authors.workspace = true

[dependencies]
tokio.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
url.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
slint.workspace = true
gl = "0.14"
euclid = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
chrono.workspace = true
tokio-tungstenite = "0.24"
futures-util = "0.3"
fjord-api = { path = "../fjord-api" }
fjord-player = { path = "../fjord-player" }
fjord-seerr = { path = "../fjord-seerr" }
aes-gcm.workspace = true
hkdf.workspace = true
sha2.workspace = true
base64.workspace = true
# On-screen-keyboard Backspace needs to remove one full grapheme cluster, not
# one Unicode scalar value (`char`) — a naive char-based trim leaves a
# dangling combining mark behind for a decomposed accented character, or half
# a flag emoji, empirically confirmed via a throwaway test before adding this
# (code-review finding, 2026-08-22). Already resolved transitively in
# Cargo.lock at 1.13.3 before this was added, so this costs nothing new to
# compile — just makes an existing transitive dependency a direct one.
unicode-segmentation = "1"
# hdr branch (2026-09-10) — real HDR passthrough Stage 1+2: a live capability
# diagnostic against the Wayland color-management-v1 protocol, run on Fjord's
# own second wayland-client connection (see hdr.rs). All three versions are
# already resolved transitively in Cargo.lock (via winit/smithay-client-toolkit's
# own dependency on the exact same wayland-protocols/wayland-backend instances,
# staging+client features already enabled) — these are direct-dependency
# declarations pinned to match, not new instances, so `use` paths become
# reachable from fjord-app's own code with zero duplicate-crate risk.
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

[build-dependencies]
slint-build = "1"
